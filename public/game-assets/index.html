<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乳腺守护者 - 乳腺癌科普 RPG</title>
    <script>
      (() => {
        const parentWindow = window.parent;
        const chapter = new URLSearchParams(window.location.search).get(
          "initialChapter",
        );
        const chapterLabels = {
          childhood: "幼年视角",
          youth: "青壮年视角",
          elderly: "老年视角",
        };
        const completionLabels = {
          "遗憾的结局": "be",
          "一周目通关！": "he",
          "完美通关！": "special",
        };
        let hasReportedCompletion = false;

        const notifyParent = (type, detail = {}) => {
          if (parentWindow === window) return;
          parentWindow.postMessage(
            { source: "breast-guardian-game", type, ...detail },
            window.location.origin,
          );
        };

        const clickRequestedChapter = () => {
          const label = chapter ? chapterLabels[chapter] : undefined;
          if (!label) return true;

          const buttons = Array.from(document.querySelectorAll("button"));
          const startButton = buttons.find((button) =>
            button.textContent?.includes("开始游戏"),
          );
          if (startButton) {
            startButton.click();
            return false;
          }

          const heading = Array.from(document.querySelectorAll("h3")).find(
            (element) => element.textContent?.includes(label),
          );
          const chapterCard = heading?.closest('[class*="cursor-pointer"]');
          if (chapterCard instanceof HTMLElement) {
            chapterCard.click();
            notifyParent("breast-guardian:chapter-start", { chapter });
            return true;
          }

          return false;
        };

        window.addEventListener("DOMContentLoaded", () => {
          const completionObserver = new MutationObserver(() => {
            if (hasReportedCompletion) return;

            const heading = Array.from(document.querySelectorAll("h1")).find(
              (element) => completionLabels[element.textContent?.trim()],
            );
            const title = heading?.textContent?.trim();
            if (!title) return;

            hasReportedCompletion = true;
            notifyParent("breast-guardian:complete", {
              stats: {
                chapter: chapter ?? null,
                ending: completionLabels[title],
                title,
              },
            });
            completionObserver.disconnect();
          });
          completionObserver.observe(document.body, {
            childList: true,
            subtree: true,
          });

          document.addEventListener("click", (event) => {
            const answer = event.target?.closest?.("[data-question-id]");
            if (!(answer instanceof HTMLElement)) return;

            notifyParent("breast-guardian:quiz-answer", {
              questionId: String(answer.dataset.questionId ?? ""),
              isCorrect: answer.dataset.correct === "true",
            });
          });

          if (!chapter || clickRequestedChapter()) return;

          const observer = new MutationObserver(() => {
            if (clickRequestedChapter()) observer.disconnect();
          });
          observer.observe(document.body, { childList: true, subtree: true });
          window.setTimeout(() => observer.disconnect(), 15000);
        });

        window.addEventListener("load", () => {
          notifyParent("breast-guardian:ready");
        });

        window.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          event.preventDefault();
          notifyParent("breast-guardian:close");
        });

        document.addEventListener("breast-guardian:complete", (event) => {
          notifyParent("breast-guardian:complete", {
            stats: event.detail?.stats ?? {},
          });
        });

        document.addEventListener("breast-guardian:quiz-answer", (event) => {
          notifyParent("breast-guardian:quiz-answer", {
            questionId: String(event.detail?.questionId ?? ""),
            isCorrect: Boolean(event.detail?.isCorrect),
          });
        });
      })();
    </script>
    <script
      type="module"
      crossorigin
      src="./assets/index-CLpBp7h-.js"
    ></script>
    <link
      rel="stylesheet"
      crossorigin
      href="./assets/index-DAu8qGCc.css"
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
