<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stakeholder Sustainability Tracker</title>
<style>
:root{--bg:#f5f7f4;--panel:#fff;--text:#1f2d25;--muted:#718078;--line:#e1e8e2;--green:#2f6f58;--green2:#e9f3ed;--blue2:#eaf2f6;--orange2:#f6ece4;--red2:#f7eaea;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}
.sidebar{background:#183d31;color:#fff;padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logoBox{background:#fff;border-radius:12px;padding:8px 9px;margin-bottom:14px}.logoBox img{width:100%;height:auto;display:block}
.toolName{font-weight:700;font-size:14px;padding:0 4px 16px;border-bottom:1px solid rgba(255,255,255,.13)}
.nav{display:grid;gap:4px;padding-top:14px}.nav button{border:0;background:transparent;color:#cfe0d8;text-align:left;padding:10px 11px;border-radius:8px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}
.main{min-width:0}.topbar{min-height:72px;padding:13px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:17px;margin:0}.topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:flex;background:#eef2ef;padding:3px;border-radius:9px}.lang button{border:0;background:transparent;padding:6px 8px;border-radius:7px;color:#68766e}.lang button.active{background:#fff;color:#1d3328}
.btn{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;color:var(--text)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:#9b4d4d}
.content{max-width:1500px;margin:auto;padding:22px 24px 44px}.section{display:none}.section.active{display:block}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px}.stat label{display:block;font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.stat small{font-size:9px;color:#88958e}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.panelHead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panelHead h3{font-size:12px;margin:0}
.search input{border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:245px}
.dashboardGrid{display:grid;grid-template-columns:1.3fr .7fr;gap:13px}
.activityItem{display:grid;grid-template-columns:90px 1fr auto;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}.activityItem:last-child{border-bottom:0}.activityItem:hover{background:#fafcfb}.activityDate{font-size:9px;color:var(--muted)}.activityMain b{font-size:11px}.activityMain p{font-size:9px;color:var(--muted);margin:3px 0;line-height:1.45}
.attentionItem{padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer}.attentionItem:last-child{border-bottom:0}.attentionItem b{font-size:10px}.attentionItem p{font-size:9px;color:var(--muted);line-height:1.4;margin:4px 0}
.groupTabs,.reviewTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:9px}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.stakeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stakeCard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}.stakeCard:hover{border-color:#c8d8ce}.stakeTop{display:flex;gap:9px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800}.stakeTop h4{font-size:12px;margin:0}.stakeTop p{font-size:9px;color:var(--muted);margin:3px 0 0}.stakeNums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.stakeNum{background:#f8faf8;border-radius:8px;padding:8px}.stakeNum strong{font-size:15px;display:block}.stakeNum span{font-size:8px;color:var(--muted)}
.reviewLayout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}.feedbackList{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.feedbackRow{display:grid;grid-template-columns:90px 1fr 120px 90px;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.feedbackRow:last-child{border-bottom:0}.feedbackRow:hover,.feedbackRow.selected{background:#fafcfb}.feedbackRow .date{font-size:9px;color:var(--muted)}.feedbackRow .body b{font-size:10px}.feedbackRow .body p{font-size:9px;color:var(--muted);line-height:1.45;margin:3px 0}
.preview{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;position:sticky;top:90px;height:max-content}.preview h4{font-size:12px;margin:0 0 8px}.previewSec{padding:9px 0;border-top:1px solid var(--line)}.previewSec:first-of-type{border-top:0}.previewSec label{display:block;font-size:8px;text-transform:uppercase;color:#7d8982;margin-bottom:4px}.previewSec div{font-size:10px;line-height:1.45}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kanbanCol{background:#eef2ef;border:1px solid var(--line);border-radius:var(--r);min-height:430px;overflow:hidden}.kanbanHead{padding:11px 12px;border-bottom:1px solid #dce4de;display:flex;justify-content:space-between}.kanbanHead b{font-size:10px}.kanbanHead span{font-size:9px;color:var(--muted)}.kanbanBody{padding:9px;display:grid;gap:8px}.task{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer}.task h5{font-size:10px;margin:0 0 4px}.task p{font-size:9px;color:var(--muted);line-height:1.4;margin:0 0 7px}.taskMeta{display:flex;justify-content:space-between;font-size:8px;color:#849088;margin-top:7px}
.sdgGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.sdgPanel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.sdgHead{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.sdgHead h4{font-size:12px;margin:2px 0 0}.sdgHead small{font-size:8px;color:var(--muted)}.sdgCounts{text-align:right;font-size:8px;color:var(--muted);line-height:1.5}.sdgPerson{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}.sdgPerson:last-child{border-bottom:0}.sdgPerson:hover{background:#fafcfb}.sdgPerson b{font-size:10px}.sdgPerson small{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.chip{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:8px;margin:1px 2px 1px 0}.green{background:var(--green2);color:#285f4b}.blue{background:var(--blue2);color:#355f74}.orange{background:var(--orange2);color:#8f5a32}.red{background:var(--red2);color:#8d4949}.gray{background:#eef1ef;color:#64716a}
.overlay{position:fixed;inset:0;background:rgba(19,34,27,.22);z-index:40;display:none}.overlay.show{display:block}
.drawer{position:fixed;right:-410px;top:0;width:400px;max-width:94vw;height:100vh;background:#fff;z-index:50;padding:21px;overflow:auto;transition:.22s;box-shadow:-18px 0 50px rgba(20,40,32,.14)}.drawer.open{right:0}.drawer h3{font-size:15px;margin:0 0 15px}
.field{margin-bottom:11px}.field label{display:block;font-size:9px;color:#67746c;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.field textarea{min-height:72px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:15px}.modal.show{display:grid}.modalCard{width:min(1000px,97vw);max-height:94vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 28px 80px rgba(0,0,0,.18)}.modalHead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modalHead h3{font-size:14px;margin:0}.close{border:0;background:#f1f4f2;border-radius:8px;width:30px;height:30px}.modalBody{padding:16px}.modalFoot{padding:13px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px;position:sticky;bottom:0;background:#fff}
.formSec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.secHead{padding:10px 12px;background:#f8faf8;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.secHead b{font-size:11px}.secHead .add{margin-left:auto}.formGrid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
.feedbackBlock{border:1px solid #dce6df;border-radius:11px;margin-bottom:9px}.feedbackBlock summary{padding:10px 11px;font-size:10px;font-weight:700;cursor:pointer;background:#fbfcfb}.feedbackInner{padding:11px}.remove{float:right;border:0;background:var(--red2);color:#944c4c;border-radius:7px;padding:5px 7px;font-size:8px}
.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailBox{border:1px solid var(--line);border-radius:10px;padding:11px}.detailBox.full{grid-column:1/-1}.detailBox label{display:block;font-size:8px;text-transform:uppercase;color:#7c8880;margin-bottom:4px}.detailBox div{font-size:10px;line-height:1.5}.miniFeedback{border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px;cursor:pointer}.miniFeedback p{font-size:9px;color:var(--muted);margin:3px 0}
@media(max-width:1100px){.app{grid-template-columns:76px minmax(0,1fr)}.logoBox{padding:4px}.toolName,.nav span{display:none}.nav button{text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.dashboardGrid,.reviewLayout{grid-template-columns:1fr}.preview{position:static}.stakeGrid{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:1fr}.sdgGrid{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.content{padding:16px 12px}.topbar{padding:10px 12px;flex-wrap:wrap}.stats{grid-template-columns:1fr 1fr}.stakeGrid{grid-template-columns:1fr}.feedbackRow{grid-template-columns:1fr}.formGrid,.row2,.detailGrid{grid-template-columns:1fr}.full{grid-column:auto}}
.wikiNotice{background:#e9f3ed;border:1px solid #cbded1;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12px;line-height:1.6}.sourceTrace div{white-space:normal}.sourceTrace p{margin:9px 0}.sourceNote{background:#fff5df;border-left:3px solid #c49337;padding:9px}.sourceTrace a,.previewSec a{color:#2f6f58}.detailBox div,.previewSec div{white-space:pre-line}.feedbackRow .body p{font-size:11px}.topbar{flex-wrap:wrap}.toolName{line-height:1.5}

.modalHead{gap:12px}.modalHead h3{flex:1}.modalHead .modalLang{flex:none}.modalLang button{min-width:36px}.detailBox div,.previewSec div{white-space:normal}.multiline{white-space:pre-line!important}.feedbackRow{grid-template-columns:minmax(0,1fr) 120px 90px}.feedbackRow .body b{font-size:13px}.feedbackRow .body p{font-size:12px}.feedbackRow .body small{font-size:10px;color:var(--muted)}.activityItem{grid-template-columns:minmax(0,1fr) auto}.activityMain b{font-size:13px}.activityMain p{font-size:12px}.detailBox div{font-size:13px}.detailBox label{font-size:11px}.previewSec div{font-size:12px}.previewSec label{font-size:10px}.detailBox{padding:14px}.stakeTop h4{font-size:14px}.stakeTop p{font-size:12px}.task h5{font-size:13px}.task p{font-size:12px}.field label{font-size:12px}.field textarea{min-height:90px}.field select[multiple]{min-height:125px}.feedbackBlock summary{font-size:13px}.panelHead h3{font-size:13px}.formSec .secHead b{font-size:13px}.detailBox .miniFeedback b{font-size:12px}.detailBox .miniFeedback p{font-size:12px}.chip{font-size:10px}.attentionItem b{font-size:12px}.attentionItem p{font-size:11px}.sdgPerson b{font-size:13px}.sdgPerson small{font-size:11px}.sdgCounts{font-size:11px}.sdgHead small{font-size:11px}.tab{font-size:12px}.topbar{flex-wrap:wrap}.emptyState{padding:20px;color:var(--muted);font-size:12px}.metaLine{color:var(--muted);font-size:11px;margin-top:5px}.preview h4{font-size:15px}.plainProfile p{margin:5px 0}.formHint{font-size:11px;color:var(--muted);margin-top:5px}.noticeError{color:#944c4c}.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}.sdgPerson{grid-template-columns:1fr auto}.detailModal .modalFoot{justify-content:flex-end}.modalHead button.close{flex:none}
@media(max-width:800px){.modalHead{flex-wrap:wrap}.modalHead h3{min-width:140px}.feedbackRow{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.sidebar{display:none}.app{display:block}.topActions{gap:6px}.content{padding:16px 12px}}

</style>
</head>

 $("#kanban").innerHTML=cols.map(st=>{const rr=d.filter(r=>r.status===st&&visibleText(r,"action"));return `<div class="kanbanCol"><div class="kanbanHead"><b>${esc(label(st))}</b><span>${rr.length}</span></div><div class="kanbanBody">${rr.map(r=>`<div class="task" data-record="${r.id}"><h5>${esc(fieldText(r,"name"))}</h5><p>${plain(visibleText(r,"action"))}</p>${chips(r.areas)}${sdgChips(r.sdgs)}${fieldText(r,"owner")||r.due?`<div class="taskMeta"><span>${esc(fieldText(r,"owner"))}</span><span>${esc(r.due)}</span></div>`:""}</div>`).join("")}</div></div>`}).join("");bindRecordLinks($("#actions"));
}
const SDGS={1:["无贫穷","No Poverty"],2:["零饥饿","Zero Hunger"],3:["良好健康与福祉","Good Health and Well-being"],4:["优质教育","Quality Education"],5:["性别平等","Gender Equality"],6:["清洁饮水和卫生设施","Clean Water and Sanitation"],7:["经济适用的清洁能源","Affordable and Clean Energy"],8:["体面工作和经济增长","Decent Work and Economic Growth"],9:["产业、创新和基础设施","Industry, Innovation and Infrastructure"],10:["减少不平等","Reduced Inequalities"],11:["可持续城市和社区","Sustainable Cities and Communities"],12:["负责任消费和生产","Responsible Consumption and Production"],13:["气候行动","Climate Action"],14:["水下生物","Life Below Water"],15:["陆地生物","Life on Land"],16:["和平、正义与强大机构","Peace, Justice and Strong Institutions"],17:["促进目标实现的伙伴关系","Partnerships for the Goals"]};
function renderSdgs(){const d=globalData(),ids=[...new Set(d.flatMap(r=>r.sdgs))].sort((a,b)=>Number(a)-Number(b));$("#sdgGrid").innerHTML=ids.map(id=>{const rr=d.filter(r=>r.sdgs.includes(id)),people=groupBy(rr,groupKey);return `<div class="sdgPanel"><div class="sdgHead"><div><small>SDG ${esc(id)}</small><h4>${esc(SDGS[id]?.[lang==="zh"?0:1]||"SDG "+id)}</h4></div><div class="sdgCounts">${people.length} ${tx("stakeholders")}<br>${rr.length} ${tx("feedbackItems")}</div></div>${people.map(g=>`<div class="sdgPerson" data-stake="${esc(groupKey(g[0]))}" data-sdg="${esc(id)}"><div><b>${esc(fieldText(g[0],"name"))}</b>${label(g[0].group)?`<small>${esc(label(g[0].group))}</small>`:""}</div><span>${g.length} ${tx("feedbackItems")}</span></div>`).join("")}</div>`}).join("")||noData();$$("#sdgGrid [data-stake]").forEach(el=>el.onclick=()=>openDetail({type:"stakeholder",key:el.dataset.stake,sdg:el.dataset.sdg}))}
function detailBox(title,content,full=false){return content?`<div class="detailBox ${full?"full":""}"><label>${esc(title)}</label><div>${content}</div></div>`:""}
function profileHtml(r){const parts=[fieldText(r,"name"),fieldText(r,"org"),fieldText(r,"role"),label(r.group)].filter(Boolean);return parts.map((v,i)=>i===0?`<b>${esc(v)}</b>`:esc(v)).join("<br>")}
function recordDetailHtml(r){
 const assessment=[["relevance",r.relevance],["feasibility",r.feasibility],["strength",r.evidenceStrength],["priority",r.priority]].filter(([,v])=>label(v)).map(([k,v])=>`${tx(k)}: ${esc(label(v))}`).join("<br>");
 const feedback=visibleText(r,"feedback"),summary=visibleText(r,"summary"),reason=visibleText(r,"decisionReason"),action=visibleText(r,"action"),outcome=visibleText(r,"outcome"),evidence=visibleText(r,"evidence"),why=visibleText(r,"why");
 const decision=decisionChip(r.decision)+(reason?`<p>${plain(reason)}</p>`:""),application=chips(r.areas)+(action?`<p>${plain(action)}</p>`:"");
 return `<div class="detailGrid">${detailBox(tx("profile"),profileHtml(r),true)}${detailBox(tx("whyEngaged"),plain(why),true)}${detailBox(tx("feedback"),(feedback?`<b>${plain(feedback)}</b>`:"")+(summary?`<p>${plain(summary)}</p>`:"")+chips([r.feedbackType],"gray")+sdgChips(r.sdgs),true)}${detailBox(tx("assessment"),assessment)}${detailBox(tx("decision"),decision)}${detailBox(tx("application"),application,true)}${detailBox(tx("outcome"),statusChip(r.status)+(outcome?`<p>${plain(outcome)}</p>`:"")+chips([r.outcomeLevel],"gray"),true)}${detailBox(tx("evidence"),plain(evidence),true)}</div>`;
}
function miniFeedback(r){return `<div class="miniFeedback" data-record="${r.id}">${join([label(r.feedbackType),label(r.decision)])?`<b>${esc(join([label(r.feedbackType),label(r.decision)]))}</b>`:""}<p>${plain(visibleText(r,"feedback"))}</p>${chips(r.areas)}</div>`}
function renderDetail(){
 if(!detailContext)return;let rows=[];
 if(detailContext.type==="record"){
   const r=records.find(r=>r.id===detailContext.id);if(!r)return closeModal("detailModal");$("#detailTitle").textContent=tx("feedbackDetail");$("#detailBody").innerHTML=recordDetailHtml(r);$("#editDetail").hidden=false;$("#editDetail").style.display="";$("#editDetail").onclick=()=>{closeModal("detailModal");openEditor(r.id)};
 }else{
   rows=records.filter(r=>detailContext.type==="engagement"?r.engagementId===detailContext.id:groupKey(r)===detailContext.key&&(!detailContext.sdg||r.sdgs.includes(detailContext.sdg)));
   if(!rows.length)return closeModal("detailModal");const r=rows[0];$("#detailTitle").textContent=fieldText(r,"name")||tx("stakeholderDetail");
   const sdgs=[...new Set(rows.flatMap(x=>x.sdgs))];$("#detailBody").innerHTML=`<div class="detailGrid">${detailBox(tx("profile"),profileHtml(r),true)}${detailBox(tx("whyEngaged"),plain(visibleText(r,"why")),true)}${detailBox(tx("overview"),`${rows.length} ${tx("feedbackItems")}<br>${sdgChips(sdgs)}`,true)}<div class="detailBox full"><label>${tx("feedback")}</label>${rows.map(miniFeedback).join("")}</div></div>`;$("#editDetail").hidden=true;$("#editDetail").style.display="none";
 }
 bindRecordLinks($("#detailBody"));
}
function bindRecordLinks(root){root.querySelectorAll("[data-record]").forEach(el=>el.onclick=()=>openDetail({type:"record",id:Number(el.dataset.record)}))}
function openDetail(context){detailContext=context;renderDetail();showModal("detailModal")}
function showModal(id){$("#"+id).classList.add("show");$("#overlay").classList.add("show")}
function closeModal(id){$("#"+id).classList.remove("show");if(id==="recordModal")editorDraft=null;if(id==="detailModal")detailContext=null;if(!$$(".modal.show").length&&!$("#filterDrawer").classList.contains("open"))$("#overlay").classList.remove("show")}
const fieldOptions={mode:["Offline","Online","Hybrid"],engagementType:["Interview","Survey","Meeting","Workshop","Field Visit","Co-design","Stakeholder Engagement","Education Activity"],group:["Research & Medical","Patient / End User","Industry & Professional","Education & Communication","Public & Community","Other iGEM Teams","Government / Policy"],feedbackType:["Need","Technical Suggestion","Clinical Suggestion","Risk","Safety","Accessibility","Ethics","Environmental Concern","Economic Concern","Education / Communication","Partnership / Collaboration"],relevance:["High","Medium","Low"],feasibility:["Feasible Now","Feasible Later","Uncertain","Not Feasible"],evidenceStrength:["Strong","Moderate","Limited"],priority:["High","Medium","Low"],decision:["Adopt","Partially Adopt","Reserve for Future","Not Adopt"],status:["Planned","In Progress","Completed","Not Applicable"],outcomeLevel:["Implemented","Measured","Preliminary","Future Validation Needed"]};
function optionsFor(key,current=""){return [...new Set([...(fieldOptions[key]||[]),...records.map(r=>r[key]).filter(Boolean),...(current?[current]:[])])].filter(v=>label(v))}
function optionsHtml(values,current="",empty=true){return(empty?'<option value=""></option>':"")+values.map(v=>`<option value="${esc(v)}" ${v===current?"selected":""}>${esc(label(v))}</option>`).join("")}
function setEnum(id,key,current){const el=$("#"+id);el.innerHTML=optionsHtml(optionsFor(key,current),current);el.value=current||""}
function commonOf(r){return Object.fromEntries(commonKeys.map(k=>[k,r[k]??""]))}
function openEditor(id=null){const r=id===null?normalize({id:0}):records.find(r=>r.id===id);if(!r)return;editorDraft={editingId:id,engagementId:id===null?null:r.engagementId,common:commonOf(r),items:[id===null?{}:clone(r)]};renderEditor();showModal("recordModal")}
function setProjectedInput(el,r,key){const k=key+(lang==="en"?"En":""),raw=String(r[k]??""),shown=visibleText(r,key);el.value=shown;el.dataset.rawValue=raw;el.dataset.startValue=shown}
function readProjectedInput(el){return el.value===el.dataset.startValue?el.dataset.rawValue:el.value.trim()}
function renderEditor(){
 if(!editorDraft)return;const d=editorDraft,r={...d.items[0],...d.common};$("#recordModalTitle").textContent=tx(d.editingId===null?"newRecord":"editRecord");
 $("#mDate").value=d.common.date||"";$("#mTime").value=d.common.time||"";
 for(const [id,key] of [["mLocation","location"],["mName","name"],["mOrg","org"],["mRole","role"],["mWhy","why"]])setProjectedInput($("#"+id),r,key);
 setEnum("mMode","mode",d.common.mode);setEnum("mEngagementType","engagementType",d.common.engagementType);setEnum("mGroup","group",d.common.group);
 $("#feedbackBlocks").innerHTML=d.items.map((item,index)=>feedbackEditorHtml(item,index)).join("");
 $$("#feedbackBlocks [data-remove-block]").forEach(b=>b.onclick=()=>{captureEditor();if(editorDraft.items.length===1)return alert(tx("keepFeedback"));editorDraft.items.splice(Number(b.dataset.removeBlock),1);renderEditor()});
 $$("#feedbackBlocks [data-bilingual-field]").forEach(el=>{const r=d.items[Number(el.closest(".feedbackBlock").dataset.block)];setProjectedInput(el,r,el.dataset.bilingualField)});
}
function feedbackEditorHtml(r,index){
 const text=(key,title,cls,textarea=true)=>`<div class="field full"><label>${tx(title)}</label>${textarea?`<textarea class="${cls}" data-bilingual-field="${key}"></textarea>`:`<input class="${cls}" data-bilingual-field="${key}">`}</div>`;
 const select=(key,title,cls)=>`<div class="field"><label>${tx(title)}</label><select class="${cls}" data-enum-field="${key}">${optionsHtml(optionsFor(key,r[key]),r[key])}</select></div>`;
 const areas=[...new Set(DEFAULT_AREAS.concat(records.flatMap(r=>r.areas),r.areas||[]))].filter(v=>label(v)).sort((a,b)=>label(a).localeCompare(label(b)));
 return `<details class="feedbackBlock" data-block="${index}" open><summary>${tx("feedback")} #${index+1}</summary><div class="feedbackInner"><button type="button" class="remove" data-remove-block="${index}">${tx("remove")}</button><div class="formGrid" style="padding:0">${text("feedback","feedback","bFeedback")}${text("summary","summary","bSummary",false)}${select("feedbackType","feedbackType","bType")}${select("relevance","relevance","bRel")}${select("feasibility","feasibility","bFeas")}${select("evidenceStrength","strength","bStrength")}${select("priority","priority","bPriority")}${select("decision","decision","bDecision")}${select("status","status","bStatus")}${text("decisionReason","reason","bReason")}<div class="field full"><label>${tx("applicationArea")}</label><select class="bAreas" multiple>${areas.map(a=>`<option value="${esc(a)}" ${(r.areas||[]).includes(a)?"selected":""}>${esc(label(a))}</option>`).join("")}</select><div class="formHint">${tx("areaHint")}</div></div>${text("action","action","bAction")}${text("owner","owner","bOwner",false)}<div class="field"><label>${tx("due")}</label><input class="bDue" type="date" value="${esc(r.due||"")}"></div>${select("outcomeLevel","outcomeLevel","bOutcomeLevel")}<div class="field"><label>SDGs</label><input class="bSdgs" value="${esc((r.sdgs||[]).join(", "))}"></div>${text("outcome","outcome","bOutcome")}${text("evidence","evidence","bEvidence")}</div></div></details>`;
}
function parseList(v){return [...new Set(String(v||"").split(/[,，]/).map(s=>s.trim().replace(/^SDG\s*/i,"")).filter(Boolean))]}
function preserveSelectionOrder(previous,selected){const picked=new Set(selected);return [...(previous||[]).filter(v=>picked.has(v)),...selected.filter(v=>!(previous||[]).includes(v))]}
function captureEditor(){
 if(!editorDraft)return;const d=editorDraft,suffix=lang==="en"?"En":"";
 d.common.date=$("#mDate").value;d.common.time=$("#mTime").value;
 for(const [id,key] of [["mLocation","location"],["mName","name"],["mOrg","org"],["mRole","role"],["mWhy","why"]])d.common[key+suffix]=readProjectedInput($("#"+id));
 d.common.mode=$("#mMode").value;d.common.engagementType=$("#mEngagementType").value;d.common.group=$("#mGroup").value;
 $$("#feedbackBlocks .feedbackBlock").forEach(el=>{const item=d.items[Number(el.dataset.block)];el.querySelectorAll("[data-bilingual-field]").forEach(input=>item[input.dataset.bilingualField+suffix]=readProjectedInput(input));el.querySelectorAll("[data-enum-field]").forEach(input=>item[input.dataset.enumField]=input.value);item.areas=preserveSelectionOrder(item.areas,[...el.querySelector(".bAreas").selectedOptions].map(o=>o.value));item.sdgs=parseList(el.querySelector(".bSdgs").value);item.due=el.querySelector(".bDue").value});
}
function commitDraft(d,currentRecords){
 if(!clean(d.common.name)&&!clean(d.common.nameEn))throw Error("nameRequired");
 if(d.items.some(r=>!clean(r.feedback)&&!clean(r.feedbackEn)))throw Error("feedbackRequired");
 let out=currentRecords.map(r=>clone(r));let nextId=Math.max(0,...out.map(r=>Number(r.id)||0))+1;
 const engagement=d.engagementId||"E"+Date.now();
 if(d.editingId!==null){out=out.map(r=>r.engagementId===engagement?normalize({...r,...d.common}):r);const idx=out.findIndex(r=>r.id===d.editingId);if(idx<0)throw Error("feedbackRequired");out[idx]=normalize({...out[idx],...d.items[0],...d.common,id:d.editingId,engagementId:engagement});d.items.slice(1).forEach(item=>out.push(normalize({...item,...d.common,id:nextId++,engagementId:engagement})))}
 else d.items.forEach(item=>out.push(normalize({...item,...d.common,id:nextId++,engagementId:engagement})));
 return out;
}
function saveEditor(){captureEditor();try{records=commitDraft(editorDraft,records)}catch(e){return alert(tx(e.message))}saveStore();closeModal("recordModal");populateFilters();renderAll()}
function fillFilter(id,key,values){const el=$("#"+id),current=filters[key];el.innerHTML=`<option value="">${tx("all")}</option>`+values.filter(v=>v&&label(v)).map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join("");el.value=current||""}
function populateFilters(){const distinct=k=>[...new Set(records.map(r=>r[k]).filter(Boolean))];fillFilter("fGroup","group",distinct("group"));fillFilter("fEng","eng",distinct("engagementType"));fillFilter("fType","type",distinct("feedbackType"));fillFilter("fDecision","decision",distinct("decision"));fillFilter("fArea","area",[...new Set(records.flatMap(r=>r.areas))]);fillFilter("fSdg","sdg",[...new Set(records.flatMap(r=>r.sdgs))].sort((a,b)=>Number(a)-Number(b)));fillFilter("fStatus","status",distinct("status"));$("#fFrom").value=filters.from;$("#fTo").value=filters.to}
function renderAll(){
 $$("[data-t]").forEach(el=>el.textContent=tx(el.dataset.t));document.documentElement.lang=lang==="zh"?"zh-CN":"en";document.title=tx("appName");
 const titles={dashboard:"navDashboard",stakeholders:"navStakeholders",feedback:"navFeedback",actions:"navActions",sdgs:"navSdgs"};$("#pageTitle").textContent=tx(titles[activeView]);
 $("#dashSearch").placeholder=tx("searchDashboard");$("#feedbackSearch").placeholder=tx("searchFeedback");
 $$("[data-set-lang]").forEach(b=>b.classList.toggle("active",b.dataset.setLang===lang));$("#zhBtn").classList.toggle("active",lang==="zh");$("#enBtn").classList.toggle("active",lang==="en");
 $$("#reviewTabs [data-decision]").forEach(b=>{b.textContent=b.dataset.decision?label(b.dataset.decision):tx("all");b.classList.toggle("active",b.dataset.decision===feedbackDecision)});
 renderStats();renderDashboard();renderStakeholders();renderFeedback();renderActions();renderSdgs();
 if(detailContext)renderDetail();if(editorDraft)renderEditor();
}
function setLanguage(next){if(!["zh","en"].includes(next)||next===lang)return;if(editorDraft)captureEditor();lang=next;populateFilters();renderAll()}
function download(text,type,name){const blob=new Blob([text],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJson(){download(JSON.stringify({format:"jlu-fbh-stakeholder-tracker",version:"bilingual-demo-20261019",records},null,2),"application/json;charset=utf-8","stakeholder-tracker-bilingual.json")}
function exportCsv(){const headers=[tx("name"),tx("organization"),tx("role"),tx("date"),tx("location"),tx("feedback"),tx("summary"),tx("decision"),tx("reason"),tx("applicationArea"),tx("action"),tx("status"),tx("outcome"),tx("evidence"),"SDGs"];const rows=globalData().map(r=>[fieldText(r,"name"),fieldText(r,"org"),fieldText(r,"role"),r.date,fieldText(r,"location"),visibleText(r,"feedback"),visibleText(r,"summary"),label(r.decision),visibleText(r,"decisionReason"),r.areas.map(v=>label(v)).filter(Boolean).join("|"),visibleText(r,"action"),label(r.status),visibleText(r,"outcome"),visibleText(r,"evidence"),r.sdgs.join("|")]);const quote=v=>'"'+String(v??"").replaceAll('"','""')+'"';download("\ufeff"+[headers,...rows].map(row=>row.map(quote).join(",")).join("\r\n"),"text/csv;charset=utf-8",`stakeholder-tracker-${lang}.csv`)}
function validateImport(data){const list=Array.isArray(data)?data:data?.records;if(!Array.isArray(list)||list.some(r=>!r||typeof r!=="object"||Array.isArray(r)||(!r.name&&!r.nameEn)))throw Error("importFailed");const normalized=list.map(normalize);if(new Set(normalized.map(r=>r.id)).size!==normalized.length)throw Error("importFailed");return normalized}
function init(){
 $("#zhBtn").onclick=()=>setLanguage("zh");$("#enBtn").onclick=()=>setLanguage("en");$$('[data-set-lang]').forEach(b=>b.onclick=()=>setLanguage(b.dataset.setLang));
 $$(".nav button").forEach(b=>b.onclick=()=>{activeView=b.dataset.view;$$(".nav button").forEach(x=>x.classList.toggle("active",x===b));$$(".section").forEach(x=>x.classList.toggle("active",x.id===activeView));renderAll()});
 $("#dashSearch").oninput=e=>{dashboardQuery=e.target.value;renderDashboard()};$("#feedbackSearch").oninput=e=>{feedbackQuery=e.target.value;renderFeedback()};
 $$("#reviewTabs [data-decision]").forEach(b=>b.onclick=()=>{feedbackDecision=b.dataset.decision;renderFeedback();$$("#reviewTabs button").forEach(x=>x.classList.toggle("active",x===b))});
 $$("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
 $("#overlay").onclick=()=>{closeModal("recordModal");closeModal("detailModal");$("#filterDrawer").classList.remove("open");$("#overlay").classList.remove("show")};
 $("#filterBtn").onclick=()=>{$("#filterDrawer").classList.add("open");$("#overlay").classList.add("show")};$("#closeFilter").onclick=()=>{$("#filterDrawer").classList.remove("open");if(!$$(".modal.show").length)$("#overlay").classList.remove("show")};
 $("#applyFilter").onclick=()=>{filters={from:$("#fFrom").value,to:$("#fTo").value,group:$("#fGroup").value,eng:$("#fEng").value,type:$("#fType").value,decision:$("#fDecision").value,area:$("#fArea").value,sdg:$("#fSdg").value,status:$("#fStatus").value};$("#closeFilter").click();renderAll()};
 $("#resetFilter").onclick=()=>{Object.keys(filters).forEach(k=>filters[k]="");populateFilters();renderAll()};
 $("#newBtn").onclick=()=>openEditor();$("#addFeedback").onclick=()=>{captureEditor();const first=editorDraft.items[0];editorDraft.items.push(editorDraft.editingId===null?{}:{stakeholderId:groupKey(first)});renderEditor()};$("#saveRecord").onclick=saveEditor;
 $("#exportBtn").onclick=exportCsv;$("#exportJsonBtn").onclick=exportJson;$("#importJsonBtn").onclick=()=>$("#importJsonFile").click();
 $("#importJsonFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=validateImport(JSON.parse(await file.text()));if(!confirm(tx("importConfirm")))return;records=data;saveStore();populateFilters();renderAll()}catch(error){alert(tx("importFailed"))}finally{e.target.value=""}};
 populateFilters();renderAll();
}
// Pure helpers are exposed for focused local tests, not for network services.
globalThis.TrackerDemo={normalize,fieldText,visibleText,label,recordDetailHtml,commitDraft,validateImport,preserveSelectionOrder,groupKey,STORAGE_KEY,seed:SEED,setTestLanguage:value=>lang=value,getRecords:()=>clone(records)};
if(typeof document!=="undefined")init();

</script>
