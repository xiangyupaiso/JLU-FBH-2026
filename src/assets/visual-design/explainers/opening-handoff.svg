<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="title"><title id="title">Loading readiness, title reading hold and header handoff</title><rect width="900" height="375" fill="#fcfaf4"/><g font-family="Arial, sans-serif"><text x="36" y="40" fill="#65705b" font-size="17" font-weight="600" text-anchor="start">OPENING / SEPARATE RELEASE CONDITIONS</text><rect x="36" y="86" width="190" height="116" rx="12" fill="#edf0e3" stroke="#cbd3bd"/><text x="52" y="116" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">01</text><text x="52" y="151" fill="#283f32" font-size="23" font-weight="600" text-anchor="start">Prepare</text><text x="52" y="179" fill="#65705b" font-size="15" font-weight="400" text-anchor="start">Styles · fonts · images</text><line x1="228" y1="144" x2="247" y2="144" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M240,139 L247,144 L240,149" fill="none" stroke="#8ba477" stroke-width="2"/><rect x="251" y="86" width="190" height="116" rx="12" fill="#edf0e3" stroke="#cbd3bd"/><text x="267" y="116" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">02</text><text x="267" y="151" fill="#283f32" font-size="23" font-weight="600" text-anchor="start">Reveal title</text><text x="267" y="179" fill="#65705b" font-size="15" font-weight="400" text-anchor="start">Lettering + subtitle</text><line x1="443" y1="144" x2="462" y2="144" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M455,139 L462,144 L455,149" fill="none" stroke="#8ba477" stroke-width="2"/><rect x="466" y="86" width="190" height="116" rx="12" fill="#f4e7e5" stroke="#cbd3bd"/><text x="482" y="116" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">03</text><text x="482" y="151" fill="#283f32" font-size="23" font-weight="600" text-anchor="start">Hold to read</text><text x="482" y="179" fill="#65705b" font-size="15" font-weight="400" text-anchor="start">After the final word</text><line x1="658" y1="144" x2="677" y2="144" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M670,139 L677,144 L670,149" fill="none" stroke="#8ba477" stroke-width="2"/><rect x="681" y="86" width="190" height="116" rx="12" fill="#edf0e3" stroke="#cbd3bd"/><text x="697" y="116" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">04</text><text x="697" y="151" fill="#283f32" font-size="23" font-weight="600" text-anchor="start">Enter story</text><text x="697" y="179" fill="#65705b" font-size="15" font-weight="400" text-anchor="start">Identity → header</text><line x1="38" y1="242" x2="860" y2="242" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><text x="40" y="279" fill="#283f32" font-size="19" font-weight="400" text-anchor="start">Skip → resolve to completed introduction</text><text x="40" y="312" fill="#283f32" font-size="19" font-weight="400" text-anchor="start">Reduced motion → finished title + Continue</text><text x="860" y="350" fill="#65705b" font-size="15" font-weight="400" text-anchor="end">Sequence schematic · widths are not elapsed time</text></g></svg>