<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-labelledby="title"><title id="title">Documented surface and label timing for ordinary capsule expansion and folding</title><rect width="900" height="476" fill="#fcfaf4"/><g font-family="Arial, sans-serif"><text x="36" y="40" fill="#65705b" font-size="17" font-weight="600" text-anchor="start">CAPSULE TIMING / SURFACE AND LETTERING HAVE SEPARATE TRACKS</text><line x1="220.0" y1="93" x2="220.0" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="220.0" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">0</text><line x1="400.83333333333337" y1="93" x2="400.83333333333337" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="400.83333333333337" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">140</text><line x1="530.0" y1="93" x2="530.0" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="530.0" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">240</text><line x1="607.5" y1="93" x2="607.5" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="607.5" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">300</text><line x1="762.5" y1="93" x2="762.5" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="762.5" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">420</text><line x1="840.0" y1="93" x2="840.0" y2="358" stroke="#dfe3d5" stroke-width="1" stroke-dasharray="4 4"/><text x="840.0" y="79" fill="#65705b" font-size="16" font-weight="400" text-anchor="middle">480</text><text x="842" y="54" fill="#65705b" font-size="16" font-weight="400" text-anchor="end">milliseconds</text><text x="40" y="129" fill="#283f32" font-size="19" font-weight="500" text-anchor="start">Surface opens</text><rect x="220.0" y="109" width="620.0" height="28" rx="5" fill="#8ba477" stroke="none"/><text x="40" y="184" fill="#283f32" font-size="19" font-weight="500" text-anchor="start">Labels fade in</text><rect x="530.0" y="164" width="232.5" height="28" rx="5" fill="#b56570" stroke="none"/><text x="40" y="269" fill="#283f32" font-size="19" font-weight="500" text-anchor="start">Surface folds</text><rect x="220.0" y="249" width="620.0" height="28" rx="5" fill="#8ba477" stroke="none"/><text x="40" y="324" fill="#283f32" font-size="19" font-weight="500" text-anchor="start">Labels fade out</text><rect x="220.0" y="304" width="180.83333333333334" height="28" rx="5" fill="#b56570" stroke="none"/><text x="535" y="215" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">Enter after the surface has a lead</text><text x="418" y="359" fill="#65705b" font-size="16" font-weight="400" text-anchor="start">Label translation ends; visibility becomes hidden at 300 ms</text><text x="40" y="411" fill="#283f32" font-size="18" font-weight="400" text-anchor="start">Expansion: width 480 ms · labels translate over 420 ms</text><text x="40" y="445" fill="#283f32" font-size="18" font-weight="400" text-anchor="start">Folding: opacity 140 ms · translation / visibility 300 ms · width 480 ms</text></g></svg>