<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title"><title id="title">Eased property interpolation followed by a reading hold</title><rect width="900" height="425" fill="#fcfaf4"/><g font-family="Arial, sans-serif"><text x="36" y="40" fill="#65705b" font-size="17" font-weight="600" text-anchor="start">READING RHYTHM / MOTION FOLLOWED BY A STILL COMPOSITION</text><rect x="540" y="78" width="275" height="232" rx="0" fill="#edf0e3" stroke="none"/><text x="566" y="110" fill="#65705b" font-size="18" font-weight="600" text-anchor="start">READING HOLD</text><line x1="90" y1="310" x2="837" y2="310" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M830,305 L837,310 L830,315" fill="none" stroke="#8ba477" stroke-width="2"/><line x1="90" y1="310" x2="90" y2="80" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M90 285 C190 285 210 125 390 125 L815 125" fill="none" stroke="#b56570" stroke-width="5" stroke-dasharray="" stroke-linecap="round"/><line x1="540" y1="125" x2="540" y2="310" stroke="#8ba477" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="390" cy="125" r="6" fill="#b56570"/><text x="150" y="214" fill="#283f32" font-size="22" font-weight="600" text-anchor="start">Eased travel</text><text x="570" y="164" fill="#283f32" font-size="20" font-weight="400" text-anchor="start">Object + explanation</text><text x="570" y="194" fill="#283f32" font-size="20" font-weight="400" text-anchor="start">stay available together</text><text x="90" y="351" fill="#283f32" font-size="19" font-weight="400" text-anchor="start">Normalized scroll progress p →</text><text x="90" y="65" fill="#283f32" font-size="18" font-weight="400" text-anchor="start">Property x</text><text x="90" y="395" fill="#65705b" font-size="18" font-weight="400" text-anchor="start">Scrolling back retraces the transition; stopping keeps the current state.</text></g></svg>