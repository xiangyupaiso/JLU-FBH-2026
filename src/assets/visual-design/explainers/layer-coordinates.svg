<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">Restore a cropped layer using normalized coordinates</title><rect width="900" height="480" fill="#fcfaf4"/><g font-family="Arial, sans-serif"><text x="36" y="40" fill="#65705b" font-size="17" font-weight="600" text-anchor="start">LAYER REGISTRATION / KEEP THE CANVAS ORIGIN</text><rect x="65" y="80" width="420" height="250" rx="12" fill="#f0f2e9" stroke="#cbd3bd"/><text x="65" y="65" fill="#283f32" font-size="20" font-weight="600" text-anchor="start">Master canvas W × H</text><rect x="200" y="148" width="190" height="144" rx="0" fill="#efdada" stroke="#b56570"/><text x="219" y="230" fill="#283f32" font-size="20" font-weight="600" text-anchor="start">Layer bounds</text><line x1="65" y1="148" x2="200" y2="148" stroke="#b56570" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="200" y1="80" x2="200" y2="148" stroke="#b56570" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="65" cy="80" r="4" fill="#283f32"/><text x="75" y="104" fill="#283f32" font-size="16" font-weight="400" text-anchor="start">(0, 0)</text><text x="116" y="139" fill="#b56570" font-size="21" font-weight="400" text-anchor="start">x₀</text><text x="208" y="121" fill="#b56570" font-size="21" font-weight="400" text-anchor="start">y₀</text><text x="202" y="315" fill="#b56570" font-size="18" font-weight="400" text-anchor="start">x₁ − x₀</text><line x1="500" y1="205" x2="551" y2="205" stroke="#8ba477" stroke-width="2" stroke-dasharray=""/><path d="M544,200 L551,205 L544,210" fill="none" stroke="#8ba477" stroke-width="2"/><rect x="582" y="141" width="250" height="149" rx="12" fill="#f0f2e9" stroke="#cbd3bd"/><rect x="662" y="181" width="114" height="86" rx="0" fill="#efdada" stroke="#b56570"/><text x="582" y="113" fill="#283f32" font-size="20" font-weight="600" text-anchor="start">Responsive display</text><text x="65" y="375" fill="#283f32" font-size="23" font-weight="400" text-anchor="start">left = 100 x₀ / W</text><text x="487" y="375" fill="#283f32" font-size="23" font-weight="400" text-anchor="start">top = 100 y₀ / H</text><text x="65" y="414" fill="#283f32" font-size="21" font-weight="400" text-anchor="start">width = 100 (x₁ − x₀) / W</text><text x="487" y="414" fill="#283f32" font-size="21" font-weight="400" text-anchor="start">height = 100 (y₁ − y₀) / H</text><text x="65" y="456" fill="#65705b" font-size="17" font-weight="400" text-anchor="start">All four values are percentages of the original canvas.</text></g></svg>