__letter">d</span><span>The return</span></div><a class="design-panel__image" href="plates/panels/01-patient-question-d.png" target="_blank" rel="noreferrer" aria-label="Open panel d: The return"><img src="plates/panels/01-patient-question-d.png" width="1440" height="902" loading="lazy" decoding="async" alt="After the platform explanation, the question becomes “If it comes back, can we give her more options?”"></a></div></div><figcaption id="study-01-patient-question-legend"><strong class="design-plate__title">From concern to a research question.</strong> <span class="design-plate__legend"><span><strong>a–c,</strong> Person, ward and recurrence concern establish the question carried into the science.</span><span><strong>d,</strong> The return shifts the question toward the research team: can we offer her more options? The patient’s uncertainty remains the reason to investigate.</span></span> </figcaption></figure>
