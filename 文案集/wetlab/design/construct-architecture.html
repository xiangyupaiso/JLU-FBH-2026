<!DOCTYPE html>

<head>

<title>CirCure | Construct Architecture</title>
<style>
/* ============================================================
   CirCure - Construct Architecture interactive viewer
   Scoped under #cc-construct so it can be pasted into a wiki page.
   ============================================================ */
#cc-construct{
  --cc-line:#e4e8ee;
  --cc-line2:#eef1f5;
  --cc-ink:#1f2733;
  --cc-ink2:#5a6673;
  --cc-ink3:#8f99a6;
  --cc-head:#f7f9fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--cc-ink); background:#fff;
  max-width:1560px; margin:0 auto; padding:26px 20px 40px;
  box-sizing:border-box; line-height:1.55; -webkit-font-smoothing:antialiased;
}
#cc-construct *,#cc-construct *::before,#cc-construct *::after{box-sizing:border-box;}

#cc-construct .cc-title{font-size:21px;font-weight:650;letter-spacing:.2px;margin:0 0 6px;}
#cc-construct .cc-sub{font-size:13.5px;color:var(--cc-ink2);margin:0 0 20px;max-width:1020px;}
#cc-construct .cc-sub code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:#f2f4f7;padding:1px 5px;border-radius:4px;}

#cc-construct .cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;}
#cc-construct .cc-right{display:flex;flex-direction:column;gap:18px;min-width:0;}
#cc-construct .cc-panel{background:#fff;border:1px solid var(--cc-line);border-radius:10px;overflow:hidden;min-width:0;}
#cc-construct .cc-phead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;background:var(--cc-head);border-bottom:1px solid var(--cc-line);
  font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--cc-ink2);
}
#cc-construct .cc-phead .cc-meta{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--cc-ink3);}

/* ---------- map ---------- */
#cc-construct .cc-mapwrap{padding:6px 6px 8px;}
#cc-construct svg.cc-svg{display:block;width:100%;height:auto;}
#cc-construct svg.cc-svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
#cc-construct .cc-tag{cursor:pointer;stroke-width:.8;}
#cc-construct .cc-hit{fill:transparent;cursor:pointer;}
#cc-construct .cc-inlbl{font-size:10px;fill:#2f3845;pointer-events:none;font-weight:600;letter-spacing:.1px;}
#cc-construct .cc-lbl{cursor:pointer;font-size:12.5px;fill:#39424f;}
#cc-construct .cc-lead{fill:none;stroke:#ccd3db;stroke-width:.7;}
#cc-construct .cc-g:hover .cc-tag{stroke-width:1.6;stroke:#39424f;}
#cc-construct .cc-g:hover .cc-lbl{fill:#10171f;font-weight:700;}
#cc-construct .cc-g:hover .cc-lead{stroke:#99a3ae;}
#cc-construct .cc-g.is-on .cc-tag{stroke-width:1.6;stroke:#222b36;}
#cc-construct .cc-g.is-on .cc-lbl{fill:#10171f;font-weight:700;}
#cc-construct .cc-g.is-on .cc-lead{stroke:#6e7883;stroke-width:1;}
/* restriction sites - deliberately unlike the element glyphs */
#cc-construct .cc-cutmark{stroke:#2b3542;stroke-width:1.3;cursor:pointer;}
#cc-construct .cc-slbl{font-size:12.5px;fill:#1f2733;font-weight:700;cursor:pointer;}
#cc-construct .cc-spos{fill:#95a0ad;font-weight:400;}
#cc-construct .cc-gsite:hover .cc-cutmark{stroke-width:2.6;stroke:#2E7BC4;}
#cc-construct .cc-gsite:hover .cc-slbl{fill:#1d5e9c;}
#cc-construct .cc-gsite.is-on .cc-cutmark{stroke-width:2.8;stroke:#2E7BC4;}
#cc-construct .cc-gsite.is-on .cc-slbl{fill:#1d5e9c;}
#cc-construct .cc-ring{fill:none;stroke:#cfd6de;stroke-width:1.2;}
#cc-construct .cc-rtick{stroke:#c7ced6;stroke-width:.9;}
#cc-construct .cc-rnum{font-size:10.5px;fill:#8d97a3;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.4px;stroke-linejoin:round;}
#cc-construct .cc-cname{font-size:15.5px;font-weight:700;fill:#1f2733;text-anchor:middle;}
#cc-construct .cc-clen{font-size:11.5px;fill:#8f99a6;text-anchor:middle;}
/* selection wedge */
#cc-construct .cc-wedge{fill:#d7eefb;opacity:.9;pointer-events:none;}
#cc-construct .cc-wedge-edge{stroke:#111820;stroke-width:1.2;pointer-events:none;}

/* ---------- description ---------- */
#cc-construct .cc-info{flex:0 0 auto;}
#cc-construct .cc-info-body{padding:13px 16px 15px;}
#cc-construct .cc-info-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px 10px;margin-bottom:7px;}
#cc-construct .cc-info-name{font-size:16px;font-weight:650;}
#cc-construct .cc-chip{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 9px;border-radius:999px;color:#2f3845;white-space:nowrap;border:1px solid rgba(0,0,0,.08);}
#cc-construct a.cc-bba{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:999px;background:#eef2f7;color:#41506a;text-decoration:none;
  border:1px solid #dde4ed;white-space:nowrap;
}
#cc-construct a.cc-bba:hover{background:#e2e9f3;color:#24324a;}
#cc-construct .cc-coord{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--cc-ink3);white-space:nowrap;}
#cc-construct .cc-info-desc{font-size:13.3px;color:#39424f;margin:0;}
#cc-construct .cc-info-desc .cc-aa{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.3px;background:#f2f4f7;padding:0 4px;border-radius:3px;letter-spacing:.3px;}

/* ---------- sequence ---------- */
#cc-construct .cc-seqpanel{flex:1 1 0;display:flex;flex-direction:column;min-height:340px;}
#cc-construct .cc-seqscroll{
  position:relative;flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px 20px;scrollbar-width:thin;scrollbar-color:#cdd4dc transparent;
}
#cc-construct .cc-seqscroll::-webkit-scrollbar{width:9px;}
#cc-construct .cc-seqscroll::-webkit-scrollbar-thumb{background:#cdd4dc;border-radius:9px;border:2px solid #fff;}
#cc-construct .cc-seqscroll::-webkit-scrollbar-track{background:transparent;}
#cc-construct .cc-row{position:relative;margin-bottom:17px;}
#cc-construct .cc-strand{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:12.5px;letter-spacing:.235em;white-space:pre;color:#2b3542;line-height:1.42;position:relative;z-index:2;
}
#cc-construct .cc-strand.cc-anti{color:#7d8793;}
#cc-construct .cc-hl{position:absolute;left:0;top:0;height:36px;z-index:1;pointer-events:none;}
#cc-construct .cc-hl i{position:absolute;top:0;height:100%;border-radius:2px;display:block;}
#cc-construct .cc-feats{position:relative;margin-top:3px;}
#cc-construct .cc-fbar{position:absolute;height:12px;border-radius:2.5px;cursor:pointer;overflow:hidden;border:1px solid rgba(0,0,0,.001);}
#cc-construct .cc-fbar:hover{filter:brightness(.96);}
#cc-construct .cc-fbar.is-on{box-shadow:0 0 0 1.5px #222b36;}
#cc-construct .cc-fbar span{
  display:block;font-size:9px;line-height:10px;color:#2f3845;text-align:center;
  white-space:nowrap;overflow:hidden;padding:0 6px;font-weight:600;letter-spacing:.01em;
}
#cc-construct .cc-slane{position:absolute;left:0;right:0;top:0;height:18px;}
#cc-construct .cc-schip{
  position:absolute;bottom:4px;transform:translateX(-50%);
  background:#2E7BC4;color:#fff;font-size:9px;font-weight:700;line-height:12px;
  padding:0 5px;border-radius:3px;white-space:nowrap;cursor:pointer;letter-spacing:.02em;
}
#cc-construct .cc-schip::after{
  content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:3.5px solid transparent;border-top-color:#2E7BC4;border-bottom:0;
}
#cc-construct .cc-schip.is-on{background:#17497c;box-shadow:0 0 0 1.5px #17497c;}
#cc-construct .cc-schip.is-on::after{border-top-color:#17497c;}
#cc-construct .cc-cuts{position:absolute;left:0;right:0;pointer-events:none;z-index:3;}
#cc-construct .cc-cuts i{position:absolute;display:block;width:1.5px;background:#2E7BC4;}
#cc-construct .cc-ruler{position:relative;height:16px;margin-top:3px;border-top:1px solid #d8dee5;}
#cc-construct .cc-ruler i{position:absolute;top:0;width:1px;height:4px;background:#c7ced6;}
#cc-construct .cc-ruler b{position:absolute;top:4px;transform:translateX(-50%);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:400;color:#9aa4b0;white-space:nowrap;}
#cc-construct .cc-meas{position:absolute;visibility:hidden;white-space:pre;top:-9999px;left:-9999px;}

@media (max-width:1080px){
  #cc-construct .cc-grid{grid-template-columns:1fr;}
  #cc-construct .cc-seqpanel{height:460px;}
}
@media (max-width:620px){
  #cc-construct{padding:18px 12px 30px;}
  #cc-construct .cc-strand{font-size:11px;letter-spacing:.2em;}
}
</style>

var OVERVIEW =
 "<em>pCirCure-circMEV</em> is a 5,267&nbsp;bp pUC57-based transcription template. Linearised at NotI and transcribed with T7 RNA polymerase, it yields a precursor that circularises itself through permuted intron&ndash;exon splicing of the T4 <em>td</em> group&nbsp;I intron. The resulting circRNA carries synIRES-RC25 driving a single polyprotein, read in this order: the tPA secretion leader, eight HLA-A*02:01-restricted TNBC CTL epitopes joined by GSGGS linkers, the 4&times; mC3d-P28 adjuvant, the MHC class&nbsp;I trafficking domain, and a C-terminal FLAG tag. Elements carrying a BBa number are registered in the iGEM Registry; click one to open its Registry page.";

/* ---------------- helpers ---------------- */
var L=0, COMPMAP={A:"T",T:"A",G:"C",C:"G",N:"N"};
function comp(s){var o="",i;for(i=0;i<s.length;i++)o+=(COMPMAP[s[i]]||"N");return o;}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function strip(h){return String(h).replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&prime;/g,"'").replace(/&mdash;/g,"—").replace(/&ndash;/g,"–").replace(/&times;/g,"×").replace(/&amp;/g,"&");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(id){return document.getElementById(id);}
function slug(b){return b.toLowerCase().replace(/_/g,"-");}

var state={sel:null,bpl:60,adv:12,rows:[]};

/* ---------------- circular map ---------------- */
var CX=340, CY=305, RB=158, LANE0=132, LANEH=14, TH=11;
function pt(r,d){var a=(d-90)*Math.PI/180;return [(CX+r*Math.cos(a)).toFixed(2),(CY+r*Math.sin(a)).toFixed(2)];}
function ps(r,d){var p=pt(r,d);return p[0]+","+p[1];}
function ang(bp){return ((bp-1)/L)*360;}

/* plain band - used for the invisible hit area */
function bandPath(a1,a2,r,t){
  if(a2-a1<0.62) a2=a1+0.62;
  var ro=r+t/2, ri=r-t/2, la=(a2-a1)>180?1:0;
  return "M"+ps(ro,a1)+" A"+ro+" "+ro+" 0 "+la+" 1 "+ps(ro,a2)+
         " L"+ps(ri,a2)+" A"+ri+" "+ri+" 0 "+la+" 0 "+ps(ri,a1)+" Z";
}
/* element glyph: rounded-rectangle tail, triangular head.
   dir>=0 -> head at a2 (sense);  dir<0 -> head at a1 (antisense). */
function tagPath(a1,a2,r,t,dir){
  if(a2-a1<0.62) a2=a1+0.62;
  var span=a2-a1, ro=r+t/2, ri=r-t/2;
  var head=Math.min(span*0.40, 3.4);     // angular length of the triangle
  var cr  =Math.min(span*0.22, 1.0);     // angular corner radius at the tail
  var k   =t*0.20;                       // flat part of the tail edge
  var la=0;
  if(dir>=0){
    var tip=a2, base=a2-head, tail=a1, c=a1+cr;
    return "M"+ps(ro,c)+
           " A"+ro+" "+ro+" 0 "+la+" 1 "+ps(ro,base)+
           " L"+ps(r,tip)+
           " L"+ps(ri,base)+
           " A"+ri+" "+ri+" 0 "+la+" 0 "+ps(ri,c)+
           " Q"+ps(ri,tail)+" "+ps(r-k,tail)+
           " L"+ps(r+k,tail)+
           " Q"+ps(ro,tail)+" "+ps(ro,c)+" Z";
  }
  var tip2=a1, base2=a1+head, tail2=a2, c2=a2-cr;
  return "M"+ps(r,tip2)+
         " L"+ps(ro,base2)+
         " A"+ro+" "+ro+" 0 "+la+" 1 "+ps(ro,c2)+
         " Q"+ps(ro,tail2)+" "+ps(r+k,tail2)+
         " L"+ps(r-k,tail2)+
         " Q"+ps(ri,tail2)+" "+ps(ri,c2)+
         " A"+ri+" "+ri+" 0 "+la+" 0 "+ps(ri,base2)+" Z";
}
function centreArc(a1,a2,r,rev){
  var la=(a2-a1)>180?1:0;
  return rev ? "M"+ps(r,a2)+" A"+r+" "+r+" 0 "+la+" 0 "+ps(r,a1)
             : "M"+ps(r,a1)+" A"+r+" "+r+" 0 "+la+" 1 "+ps(r,a2);
}
function wedge(a1,a2,r1,r2){
  if(a2-a1<1.2){var m=(a1+a2)/2;a1=m-0.6;a2=m+0.6;}
  var la=(a2-a1)>180?1:0;
  return "M"+ps(r1,a1)+" L"+ps(r2,a1)+" A"+r2+" "+r2+" 0 "+la+" 1 "+ps(r2,a2)+
         " L"+ps(r1,a2)+" A"+r1+" "+r1+" 0 "+la+" 0 "+ps(r1,a1)+" Z";
}

function assignLanes(){
  var sorted=PARTS.slice().sort(function(a,b){return (b.end-b.start)-(a.end-a.start);});
  var lanes=[];
  sorted.forEach(function(p){
    var i=0;
    for(;;){
      if(!lanes[i]) lanes[i]=[];
      var clash=lanes[i].some(function(q){return !(p.end<q.start||p.start>q.end);});
      if(!clash){lanes[i].push(p);p.lane=i;break;}
      i++;
    }
  });
}
function spread(items,minY,maxY,gap){
  items.sort(function(a,b){return a.y-b.y;});
  var i;
  for(i=1;i<items.length;i++) if(items[i].y-items[i-1].y<gap) items[i].y=items[i-1].y+gap;
  if(items.length){var over=items[items.length-1].y-maxY;
    if(over>0) for(i=0;i<items.length;i++) items[i].y-=over;}
  for(i=items.length-2;i>=0;i--) if(items[i+1].y-items[i].y<gap) items[i].y=items[i+1].y-gap;
  if(items.length&&items[0].y<minY){var sh=minY-items[0].y;for(i=0;i<items.length;i++) items[i].y+=sh;}
  return items;
}

function buildMap(){
  assignLanes();
  var defs=[], kbnum=[], rings=[], groups=[];

  rings.push('<circle class="cc-ring" cx="'+CX+'" cy="'+CY+'" r="'+RB+'"/>');
  for(var k=1000;k<L;k+=1000){
    var a=ang(k);
    rings.push('<line class="cc-rtick" x1="'+pt(RB,a)[0]+'" y1="'+pt(RB,a)[1]+'" x2="'+pt(RB-6,a)[0]+'" y2="'+pt(RB-6,a)[1]+'"/>');
    kbnum.push('<text class="cc-rnum" x="'+pt(RB+13,a)[0]+'" y="'+(parseFloat(pt(RB+13,a)[1])+3)+'">'+k+'</text>');
  }
  rings.push('<line class="cc-rtick" x1="'+CX+'" y1="'+(CY-RB-5)+'" x2="'+CX+'" y2="'+(CY-RB+6)+'" stroke="#8f99a6" stroke-width="1.4"/>');
  rings.push('<text class="cc-cname" x="'+CX+'" y="'+(CY-4)+'">pCirCure-circMEV</text>');
  rings.push('<text class="cc-clen" x="'+CX+'" y="'+(CY+13)+'">5,267 bp</text>');

  // which elements need an external label?
  var right=[], left=[], inline=[];
  PARTS.forEach(function(p){
    var a1=ang(p.start), a2=ang(p.end);
    if(a2-a1<0.62) a2=a1+0.62;
    p._a1=a1; p._a2=a2;
    p._r = LANE0 - p.lane*LANEH;
    var mid=(a1+a2)/2; p._mid=mid;
    var txt=strip(p.shrt);
    var arcLen = p._r*(a2-a1)*Math.PI/180;
    var txtW   = txt.length*10*0.56;
    if(arcLen > txtW+4){ p._inline=true; inline.push(p); }
    else {
      p._inline=false;
      var o={p:p,y:parseFloat(pt(RB+8,mid)[1])};
      (Math.cos((mid-90)*Math.PI/180)>=0?right:left).push(o);
    }
  });
  SITES.forEach(function(S){
    var a=ang(S.cut); S._a=a;
    (Math.cos((a-90)*Math.PI/180)>=0?right:left).push({site:S,y:parseFloat(pt(RB+8,a)[1])});
  });
  spread(right,13,607,16);
  spread(left ,13,607,16);

  function tagSvg(p){
    return '<path class="cc-tag" d="'+tagPath(p._a1,p._a2,p._r,TH,p.strand)+'" fill="'+CAT[p.cat].c+'" stroke="'+CAT[p.cat].s+'" stroke-linejoin="round"/>'+
           '<path class="cc-hit" d="'+bandPath(p._a1,p._a2,p._r,TH+10)+'"><title>'+esc(strip(p.name))+' ('+fmt(p.start)+'..'+fmt(p.end)+')</title></path>';
  }

  inline.forEach(function(p){
    var rev = p._mid>180;
    defs.push('<path id="ccarc_'+p.id+'" d="'+centreArc(p._a1,p._a2,p._r,rev)+'" fill="none"/>');
    groups.push('<g class="cc-g" data-id="'+p.id+'">'+tagSvg(p)+
      '<text class="cc-inlbl" dominant-baseline="central"><textPath href="#ccarc_'+p.id+'" startOffset="50%" text-anchor="middle">'+esc(strip(p.shrt))+'</textPath></text></g>');
  });

  function emit(o,side){
    if(o.site){
      var S=o.site, a=S._a;
      var eX=side>0?CX+188:CX-188, tX=side>0?CX+194:CX-194;
      var an=pt(RB+8,a);
      groups.push('<g class="cc-g cc-gsite" data-id="'+S.id+'">'+
        '<line class="cc-cutmark" x1="'+pt(RB-9,a)[0]+'" y1="'+pt(RB-9,a)[1]+'" x2="'+pt(RB+8,a)[0]+'" y2="'+pt(RB+8,a)[1]+'"/>'+
        '<polyline class="cc-lead" points="'+an[0]+','+an[1]+' '+eX+','+o.y+' '+tX+','+o.y+'"/>'+
        '<text class="cc-slbl" x="'+(side>0?tX+4:tX-4)+'" y="'+(o.y+3)+'" text-anchor="'+(side>0?"start":"end")+'">'+
          S.name+'<tspan class="cc-spos"> ('+fmt(S.cut)+')</tspan></text></g>');
      return;
    }
    var p=o.p;
    var anchor=pt(RB+3,p._mid), tA=pt(RB-3,p._mid), tB=pt(RB+6,p._mid);
    var elbowX=side>0?CX+188:CX-188, textX=side>0?CX+194:CX-194;
    groups.push('<g class="cc-g" data-id="'+p.id+'">'+
      '<line x1="'+tA[0]+'" y1="'+tA[1]+'" x2="'+tB[0]+'" y2="'+tB[1]+'" stroke="'+CAT[p.cat].s+'" stroke-width="1.6"/>'+
      '<polyline class="cc-lead" points="'+anchor[0]+','+anchor[1]+' '+elbowX+','+o.y+' '+textX+','+o.y+'"/>'+
      tagSvg(p)+
      '<text class="cc-lbl" x="'+(side>0?textX+4:textX-4)+'" y="'+(o.y+3)+'" text-anchor="'+(side>0?"start":"end")+'">'+esc(strip(p.shrt))+'</text></g>');
  }
  right.forEach(function(o){emit(o,1);});
  left .forEach(function(o){emit(o,-1);});

  var svg=el("ccSvg");
  svg.innerHTML='<defs>'+defs.join("")+'</defs>'+
                '<g id="ccWedge"></g>'+rings.join("")+groups.join("")+kbnum.join("");
  svg.addEventListener("click",function(ev){
    var g=ev.target.closest?ev.target.closest(".cc-g"):null;
    if(g) select(g.getAttribute("data-id"),true);
  });
}

function paintWedge(){
  var g=el("ccWedge"), p=state.sel;
  if(!p){ g.innerHTML=""; return; }
  var a1=p._a1, a2=p._a2;
  if(a2-a1<1.2){var m=(a1+a2)/2;a1=m-0.6;a2=m+0.6;}
  g.innerHTML='<path class="cc-wedge" d="'+wedge(p._a1,p._a2,56,RB+16)+'"/>'+
    '<line class="cc-wedge-edge" x1="'+pt(46,a1)[0]+'" y1="'+pt(46,a1)[1]+'" x2="'+pt(RB+34,a1)[0]+'" y2="'+pt(RB+34,a1)[1]+'"/>'+
    '<line class="cc-wedge-edge" x1="'+pt(46,a2)[0]+'" y1="'+pt(46,a2)[1]+'" x2="'+pt(RB+34,a2)[0]+'" y2="'+pt(RB+34,a2)[1]+'"/>';
}

/* ---------------- sequence ---------------- */
function measureAdv(box){
  var m=document.createElement("div");
  m.className="cc-strand cc-meas"; m.textContent=new Array(101).join("A");
  box.appendChild(m);
  var w=m.getBoundingClientRect().width/100;
  var cs=getComputedStyle(m);
  state.ls=parseFloat(cs.letterSpacing)||0;
  state.lh=m.getBoundingClientRect().height;
  box.removeChild(m);
  return w||12;
}
/* x of the gap that follows base n, within a row starting at s */
function cutX(n,s){ return (n-s+1)*state.adv - state.ls/2; }
function renderSeq(){
  var box=el("ccSeq"), adv=measureAdv(box);
  var bpl=Math.floor((box.clientWidth-26)/adv);
  bpl=Math.floor(bpl/10)*10;
  if(bpl<30) bpl=30; if(bpl>120) bpl=120;
  state.adv=adv; state.bpl=bpl;

  var html=[], s,e,i;
  for(s=1;s<=L;s+=bpl){
    e=Math.min(L,s+bpl-1);
    var sub=SEQ.slice(s-1,e);
    var fs=PARTS.filter(function(p){return p.end>=s&&p.start<=e;});
    fs.sort(function(a,b){return (a.start-b.start)||((b.end-b.start)-(a.end-a.start));});
    var lanes=[], bars=[];
    fs.forEach(function(p){
      var li=0; while(lanes[li]!==undefined&&lanes[li]>=p.start) li++;
      lanes[li]=p.end;
      var a=Math.max(p.start,s), b=Math.min(p.end,e);
      var left=(a-s)*adv, w=(b-a+1)*adv;
      var label=w>46?esc(strip(p.shrt)):"";
      var hd=(p.strand>=0&&b===p.end)?1:((p.strand<0&&a===p.start)?-1:0);
      var pk=Math.min(6,w*0.4).toFixed(1);
      var clip = hd===1  ? "polygon(0 0, calc(100% - "+pk+"px) 0, 100% 50%, calc(100% - "+pk+"px) 100%, 0 100%)"
               : hd===-1 ? "polygon("+pk+"px 0, 100% 0, 100% 100%, "+pk+"px 100%, 0 50%)" : "";
      bars.push('<div class="cc-fbar" data-id="'+p.id+'" title="'+esc(strip(p.name))+' ('+fmt(p.start)+'..'+fmt(p.end)+')" '+
        'style="left:'+left.toFixed(2)+'px;width:'+w.toFixed(2)+'px;top:'+(li*15)+'px;background:'+CAT[p.cat].c+';border-color:'+CAT[p.cat].s+
        (clip?';-webkit-clip-path:'+clip+';clip-path:'+clip:'')+'"><span>'+label+'</span></div>');
    });
    var laneH=lanes.length?lanes.length*15:0;

    // restriction sites falling in this row
    var chips=[], cuts=[], siteH=0;
    SITES.forEach(function(S){
      if(S.cut<s||S.cut>e) return;
      siteH=18;
      var xt=cutX(S.cut,s), xb=cutX(Math.min(Math.max(S.cutB,s),e),s);
      var lo=Math.min(xt,xb), hi=Math.max(xt,xb);
      chips.push('<div class="cc-schip" data-id="'+S.id+'" style="left:'+xt.toFixed(2)+'px">'+S.name+'</div>');
      cuts.push('<i style="left:'+(xt-0.75).toFixed(2)+'px;top:0;height:50%"></i>'+
                '<i style="left:'+lo.toFixed(2)+'px;top:calc(50% - 0.75px);width:'+(hi-lo).toFixed(2)+'px;height:1.5px"></i>'+
                '<i style="left:'+(xb-0.75).toFixed(2)+'px;top:50%;height:50%"></i>');
    });

    var rul=['<b style="left:'+(adv/2).toFixed(2)+'px">'+s+'</b>','<i style="left:0px"></i>'];
    for(i=s;i<=e;i++) if(i%10===0){
      var x=(i-s)*adv+adv/2;
      rul.push('<i style="left:'+x.toFixed(2)+'px"></i>','<b style="left:'+x.toFixed(2)+'px">'+i+'</b>');
    }

    html.push('<div class="cc-row" data-s="'+s+'" data-e="'+e+'" style="padding-top:'+siteH+'px">'+
      (siteH?'<div class="cc-slane">'+chips.join("")+'</div>':'')+
      '<div class="cc-hl" style="top:'+siteH+'px"></div>'+
      '<div class="cc-strand">'+sub+'</div><div class="cc-strand cc-anti">'+comp(sub)+'</div>'+
      (cuts.length?'<div class="cc-cuts" style="top:'+siteH+'px;height:'+(state.lh*2).toFixed(1)+'px">'+cuts.join("")+'</div>':'')+
      '<div class="cc-feats" style="height:'+laneH+'px">'+bars.join("")+'</div>'+
      '<div class="cc-ruler">'+rul.join("")+'</div></div>');
  }
  box.innerHTML=html.join("");
  state.rows=Array.prototype.slice.call(box.querySelectorAll(".cc-row"));
  paintHighlight();
}
function paintHighlight(){
  var p=state.sel, adv=state.adv;
  state.rows.forEach(function(row){
    var hl=row.querySelector(".cc-hl"), s=+row.getAttribute("data-s"), e=+row.getAttribute("data-e");
    if(!p||p.end<s||p.start>e){hl.innerHTML="";return;}
    var a=Math.max(p.start,s), b=Math.min(p.end,e);
    hl.innerHTML='<i style="left:'+((a-s)*adv).toFixed(2)+'px;width:'+((b-a+1)*adv).toFixed(2)+
      'px;background:'+CAT[p.cat].c+'66;box-shadow:inset 0 0 0 1px '+CAT[p.cat].s+'"></i>';
  });
  var bars=el("ccSeq").querySelectorAll(".cc-fbar");
  for(var i=0;i<bars.length;i++) bars[i].classList.toggle("is-on",!!p&&bars[i].getAttribute("data-id")===p.id);
}

/* ---------------- selection ---------------- */
function select(id,scroll){
  var p=null,i;
  for(i=0;i<PARTS.length;i++) if(PARTS[i].id===id) p=PARTS[i];
  if(!p) for(i=0;i<SITES.length;i++) if(SITES[i].id===id) p=SITES[i];
  if(p && state.sel===p){ p=null; id=null; }     // click again to deselect
  state.sel=p;

  var gs=el("ccSvg").querySelectorAll(".cc-g");
  for(i=0;i<gs.length;i++) gs[i].classList.toggle("is-on",!!p&&gs[i].getAttribute("data-id")===id);
  if(p&&p.kind==="site") el("ccWedge").innerHTML=""; else paintWedge();

  var chips=el("ccSeq").querySelectorAll(".cc-schip");
  for(i=0;i<chips.length;i++) chips[i].classList.toggle("is-on",!!p&&chips[i].getAttribute("data-id")===id);

  var bba=el("ccBba"), chip=el("ccChip");
  if(p&&p.kind==="site"){
    el("ccName").innerHTML=p.name;
    chip.style.display=""; chip.style.background=CAT.site.c; chip.textContent="Restriction site";
    bba.style.display="none";
    el("ccCoord").textContent=p.rec+"  \u00b7  cuts after "+fmt(p.cut)+" / "+fmt(p.cutB)+"  \u00b7  unique cutter";
    el("ccDesc").innerHTML=p.note;
    el("ccHint").textContent="click again to clear";
  }else if(p){
    el("ccName").innerHTML=p.name;
    chip.style.display=""; chip.style.background=CAT[p.cat].c; chip.textContent=CAT[p.cat].n;
    if(p.bba){ bba.style.display=""; bba.textContent=p.bba; bba.href="https://registry.igem.org/parts/"+slug(p.bba); }
    else bba.style.display="none";
    el("ccCoord").textContent=fmt(p.start)+"–"+fmt(p.end)+"  ·  "+fmt(p.end-p.start+1)+" bp  ·  "+(p.strand>0?"sense":"antisense")+" strand";
    el("ccDesc").innerHTML=p.desc;
    el("ccHint").textContent="click again to clear";
  }else{
    el("ccName").innerHTML="pCirCure-circMEV";
    chip.style.display="none"; bba.style.display="none";
    el("ccCoord").textContent="5,267 bp · circular · "+PARTS.length+" elements \u00b7 "+SITES.length+" unique cutters";
    el("ccDesc").innerHTML=OVERVIEW;
    el("ccHint").textContent="select an element";
  }
  paintHighlight();

  if(p&&scroll!==false){
    for(var r=0;r<state.rows.length;r++){
      if(+state.rows[r].getAttribute("data-e")>=p.start){
        el("ccSeq").scrollTo({top:Math.max(0,state.rows[r].offsetTop-10),behavior:"smooth"});
        break;
      }
    }
  }
}

/* ---------------- boot ---------------- */
function init(){
  L=SEQ.length;
  el("ccSeqMeta").innerHTML=fmt(L)+" bp &middot; scroll to browse";
  buildMap(); renderSeq(); select(null,false);
  el("ccSeq").addEventListener("click",function(ev){
    if(!ev.target.closest) return;
    var c=ev.target.closest(".cc-schip");
    if(c){ select(c.getAttribute("data-id"),false); return; }
    var b=ev.target.closest(".cc-fbar");
    if(b) select(b.getAttribute("data-id"),false);
  });
  var t=null;
  window.addEventListener("resize",function(){clearTimeout(t);t=setTimeout(renderSeq,160);});
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();
})();
</script>
